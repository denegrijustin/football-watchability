name: Probe availability reports
on:
  push:
    branches: [slate-data]
    paths: [scripts/probe-availability.mjs, .github/workflows/probe-availability.yml]
permissions:
  contents: write
# Data jobs write to the same branch: run one at a time.
concurrency:
  group: slate-data-writes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-availability.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data-raw/avail-probe
          git diff --cached --quiet || git commit -q -m "Availability probe"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
