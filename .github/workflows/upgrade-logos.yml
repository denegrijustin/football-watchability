name: Upgrade logos
# Rebuilds public/logos from ESPN's high-resolution team logos and commits the
# result back to the branch. Runs on demand or when the logo-upgrade branch is
# pushed; review the commit before merging to main.
on:
  workflow_dispatch:
  push:
    branches: [logo-upgrade, slate-data]
    paths: [scripts/upgrade-logos.mjs, .github/workflows/upgrade-logos.yml, src/data/team-ids.json, src/data/network-ids.json]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/upgrade-logos.mjs
      - run: pnpm validate:data || echo "validation will be rerun by the build check"
      - name: Commit upgraded logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/logos public/networks src/data/logos.json src/data/logo-sources.json src/data/networks.json
          git diff --cached --quiet || git commit -m "Upgrade team logos to 128px WebP from ESPN"
          git push
