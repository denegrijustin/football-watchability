name: Fetch weather
# Quick weather-only refresh for the current slate (a few seconds). Run it
# the day before games for the freshest look-ahead.
on:
  workflow_dispatch:
  push:
    branches: [slate-data]
    paths: [scripts/fetch-weather.mjs, .github/workflows/fetch-weather.yml, data-raw/weather-request.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-weather.mjs
      - name: Commit weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data-raw/weather.json data-raw/weather-errors.json
          git diff --cached --quiet || git commit -q -m "Weather refresh $(date -u +%FT%H:%MZ)"
          git push
