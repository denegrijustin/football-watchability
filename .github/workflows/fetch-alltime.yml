name: Fetch all-time history
# Downloads head-to-head pages (Winsipedia for college, The Football Database
# for NFL) into data-raw/alltime/ and commits them to the triggering branch.
on:
  workflow_dispatch:
  push:
    branches: [slate-data]
    paths: [scripts/fetch-alltime.mjs, .github/workflows/fetch-alltime.yml, data-raw/alltime/requests.json, data-raw/alltime/phase.txt]
permissions:
  contents: write
# Data jobs write to the same branch: run one at a time.
concurrency:
  group: slate-data-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: PHASE="$(cat data-raw/alltime/phase.txt 2>/dev/null || echo full)" node scripts/fetch-alltime.mjs
        timeout-minutes: 30
      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data-raw/alltime
          git diff --cached --quiet || git commit -q -m "All-time history pages"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
