name: Probe advanced stats
on:
  workflow_dispatch:
  push:
    branches: [slate-data]
    paths: [scripts/probe-stats.mjs, .github/workflows/probe-stats.yml]
permissions:
  contents: write
concurrency:
  group: slate-data-writes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-stats.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data-raw/probe
          git diff --cached --quiet || git commit -q -m "Advanced stats probe"
          git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
